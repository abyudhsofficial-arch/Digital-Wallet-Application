<body class="auth-page"><a class="brand auth-brand" href="index.html"><span class="brand-icon">N</span> NovaPay</a><main class="auth-card"><a class="back-link" href="index.html">← Back home</a><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p class="muted">Set up your demo wallet in less than a minute.</p><form id="registerForm"><label>Full name<input id="name" required placeholder="e.g. Alex Morgan"></label><label>Email address<input id="email" type="email" required placeholder="you@example.com"></label><label>Create password<input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></label><button class="btn btn-primary full" type="submit">Create account →</button></form><p class="auth-switch">Already registered? <a href="login.html">Log in</a></p><p class="tiny-note">Demo only: do not use a real password or sensitive information.</p></main><script src="app.js"></script></body></html>
